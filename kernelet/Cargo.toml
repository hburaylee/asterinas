# SPDX-License-Identifier: MPL-2.0
[package]
name = "kernelet-userspace"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[workspace]
members = ["abi"]

[dependencies]
xattr = "1"
containerd-shim = "0.11"
kernelet-abi = { path = "abi" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
logo-ascii-art = { path = "../kernel/libs/logo-ascii-art" }
nix = { version = "0.29", features = ["socket", "uio", "fs", "mount", "term", "process", "signal", "user", "hostname", "resource", "poll"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "kernelet-runtime"
path = "src/bin/runtime.rs"

[[bin]]
name = "kernelet-agent"
path = "src/bin/agent.rs"

[workspace.lints.rust]
redundant_imports = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
allow_attributes = "warn"
inconsistent_struct_constructor = "warn"
redundant_test_prefix = "warn"

[lints]
workspace = true

[[bin]]
name = "containerd-shim-kernelet-v2"
path = "src/bin/shim.rs"
